spring.application.name=demo

# configure server port
server.port=8484

# configure my custom props
coach.name=Mickey Mouse
team.name=The Mouse Crew

# expose actuators, to expose all endpoints use wildcard "*" otherwise use comma with name
management.endpoints.web.exposure.include=*
management.info.env.enabled=true

# exclude specific endpoints (when spring security is active)
# management.endpoints.web.exposure.exclude==health, info

# customize info actuator
info.app.name=My Super Cool App
info.app.description=A crazy fun app
info.app.version=1.0.0